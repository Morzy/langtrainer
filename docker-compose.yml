services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lantrainer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lantrainer
      POSTGRES_PASSWORD: lantrainer
      POSTGRES_DB: lantrainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lantrainer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
